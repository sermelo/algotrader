[project]
name = "algotrader"
version = "0.1.0"
description = "Small, tested backtester for long-only strategies on minute bars"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "scikit-learn",
    "lxml>=6.1.3",
    "torch>=2.14.1",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["algotrader"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyTorch from the CPU-only index (the default Linux wheels pull ~2 GB of CUDA libraries).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
